<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Recipes</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }

        .recipe-list {
            margin-bottom: 20px;
        }

        .recipe-item {
            margin: 5px 0;
        }
    </style>
</head>
<body>
    <h1>User Recipes</h1>
    <div class="recipe-list" id="recipeList">
        <!-- Recipes will be displayed here -->
    </div>

    <script>async function fetchUserRecipes() {
            const urlParams = new URLSearchParams(window.location.search);
            const userId = urlParams.get('userId');
            const response = await fetch(`/api/users/${userId}/recipes`);
            const recipes = await response.json();
            const recipeList = document.getElementById('recipeList');
            recipeList.innerHTML = '';
            recipes.forEach(recipe => {
                const recipeItem = document.createElement('div');
                recipeItem.className = 'recipe-item';
                recipeItem.textContent = `Recipe: ${recipe.name}`;
                recipeList.appendChild(recipeItem);
            });
        }

        // Fetch user recipes when the page loads
        window.onload = fetchUserRecipes;</script>
</body>
</html>
