<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Input Receipt</title>
    <style>
        .form-group {
            margin-bottom: 15px;
        }

            .form-group label {
                display: block;
                margin-bottom: 5px;
            }

            .form-group input, .form-group select {
                width: 100%;
                padding: 8px;
                box-sizing: border-box;
            }

        .items {
            margin-top: 20px;
        }

        .item {
            border: 1px solid #ccc;
            padding: 10px;
            margin-bottom: 10px;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <h1>Input Receipt</h1>
    <form id="receiptForm">
        <div class="form-group">
            <label for="storeChain">Store Chain</label>
            <input type="text" id="storeChain" name="storeChain" required>
        </div>
        <div class="form-group">
            <label for="storeAddress">Store Address</label>
            <input type="text" id="storeAddress" name="storeAddress" required>
        </div>
        <div class="items">
            <h2>Items</h2>
        </div>
        <button type="button" onclick="addItem()">Add Another Item</button>
        <button type="submit">Submit</button>
    </form>

    <script>
        function addItem() {
            const itemsDiv = document.querySelector('.items');
            const newItem = document.createElement('div');
            newItem.classList.add('item');
            newItem.innerHTML = `
                        <div class="form-group">
                            <label for="goodName">Good Name</label>
                            <input type="text" id="goodName" name="goodName" required oninput="searchFood(this)">
                            <select id="foodSearchResults" class="hidden" onchange="selectFood(this)">
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="codeType">Code Type</label>
                            <select id="codeType" name="codeType" required onchange="toggleStoreCode(this)">
                                <option value="0" selected>None</option>
                                <option value="1">PLU</option>
                                <option value="2">UPC</option>
                            </select>
                        </div>
                        <div class="form-group storeCodeGroup">
                            <label for="storeCode">Store Code</label>
                            <input type="text" id="storeCode" name="storeCode">
                        </div>
                        <div class="form-group">
                            <label for="price">Price</label>
                            <input type="number" id="price" name="price" step=".01" required>
                        </div>
                        <div class="form-group">
                            <label for="unit">Unit</label>
                            <input type="text" id="unit" name="unit" required>
                        </div>
                        <div class="form-group">
                            <label for="brand">Brand</label>
                            <input type="text" id="brand" name="brand" readonly>
                        </div>
                        <div class="form-group">
                            <label for="packageWeight">Package Weight</label>
                            <input type="text" id="packageWeight" name="packageWeight" readonly>
                        </div>
                    `;
            itemsDiv.appendChild(newItem);
        }

        async function searchFood(inputElement) {
            const foodName = inputElement.value;
            if (foodName.length < 3) {
                return;
            }

            const response = await fetch(`/api/receipt/search?foodName=${foodName}`);
            if (response.ok) {
                const foods = await response.json();
                const selectElement = inputElement.nextElementSibling;
                selectElement.innerHTML = foods.map(food => `
                        <option value='${JSON.stringify(food)}'>
                            <strong>${food.brandOwner}</strong> - ${food.description} <em>(${food.packageWeight})</em>
                        </option>
                    `).join('');
                selectElement.classList.remove('hidden');
            }
        }

        function selectFood(selectElement) {
            const selectedFood = JSON.parse(selectElement.value);
            const itemDiv = selectElement.closest('.item');
            itemDiv.querySelector('[name="goodName"]').value = selectedFood.description;
            itemDiv.querySelector('[name="codeType"]').value = selectedFood.gtinUpc ? 2 : 0;
            const storeCodeInput = itemDiv.querySelector('[name="storeCode"]');
            if (selectedFood.gtinUpc) {
                storeCodeInput.value = selectedFood.gtinUpc;
                storeCodeInput.setAttribute('readonly', 'readonly');
            } else {
                storeCodeInput.value = '';
                storeCodeInput.removeAttribute('readonly');
            }
            itemDiv.querySelector('[name="brand"]').value = selectedFood.brandOwner;
            itemDiv.querySelector('[name="packageWeight"]').value = selectedFood.packageWeight;
            selectElement.classList.add('hidden');
        }

        function toggleStoreCode(selectElement) {
            const storeCodeGroup = selectElement.closest('.item').querySelector('.storeCodeGroup');
            if (selectElement.value === "0") {
                storeCodeGroup.querySelector('input').removeAttribute('required');
            } else {
                storeCodeGroup.querySelector('input').setAttribute('required', 'required');
            }
        }

        document.getElementById('receiptForm').addEventListener('submit', async function (event) {
            event.preventDefault();

            const storeChain = document.getElementById('storeChain').value;
            const storeAddress = document.getElementById('storeAddress').value;
            const items = Array.from(document.querySelectorAll('.item')).map(item => ({
                GoodName: item.querySelector('[name="goodName"]').value,
                CodeType: parseInt(item.querySelector('[name="codeType"]').value),
                StoreCode: item.querySelector('[name="storeCode"]').value || null,
                Price: parseFloat(item.querySelector('[name="price"]').value),
                Unit: item.querySelector('[name="unit"]').value,
                Brand: item.querySelector('[name="brand"]').value,
                PackageWeight: item.querySelector('[name="packageWeight"]').value
            }));

            const receiptData = {
                StoreChain: storeChain,
                StoreAddress: storeAddress,
                Goods: items
            };

            const response = await fetch('/api/receipt', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(receiptData)
            });

            if (response.ok) {
                alert('Receipt submitted successfully!');
                window.location.href = '/inputreceipt.html'; // Redirect to the same page to refresh it
            } else {
                alert('Failed to submit receipt.');
            }
        });

        document.onload = () => {
            addItem();
        }
    </script>
</body>
</html>
