<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe Details</title>
    <link type="text/css" rel="stylesheet" href="base-styles.css" />
</head>
<body>
    <h1>Recipe Details</h1>
    <div id="recipeDetails">
        <!-- Recipe details will be displayed here -->
    </div>
    <iframe id="assignMappingFrame" style="display:none; width:100%; height:400px;"></iframe>
    <script>
        let currentIngredientId;
        let currentUserId;

        async function fetchRecipeDetails() {
            const urlParams = new URLSearchParams(window.location.search);
            const recipeId = urlParams.get('recipeId');
            const userId = urlParams.get('userId');
            const response = await fetch(`/api/recipes/${recipeId}`);
            const recipe = await response.json();
            const recipeDetails = document.getElementById('recipeDetails');
            recipeDetails.innerHTML = `<h2>${recipe.name}</h2>`;

            recipe.ingredients.forEach(ingredient => {
                const ingredientItem = document.createElement('div');
                ingredientItem.className = 'ingredient-item';
                ingredientItem.innerHTML = `
                            <span>${ingredient.name}</span>
                            <button id='ingredient_${ingredient.id}' onclick="assignMapping(${ingredient.id}, ${userId})">
                                ${recipe.ingredientMappings[ingredient.id] ? recipe.ingredientMappings[ingredient.id].friendlyName : 'Assign Mapping'}
                            </button>
                        `;
                recipeDetails.appendChild(ingredientItem);
            });
        }

        function assignMapping(ingredientId, userId) {
            currentIngredientId = ingredientId;
            currentUserId = userId;
            const iframe = document.getElementById('assignMappingFrame');
            iframe.src = `assignmapping.html?ingredientId=${ingredientId}&userId=${userId}`;
            iframe.style.display = 'block';
        }

        async function closeIframe() {
            const iframe = document.getElementById('assignMappingFrame');
            iframe.style.display = 'none';

            // Fetch the updated mapping
            const response = await fetch(`/api/IngredientMapping?ingredientId=${currentIngredientId}`);
            if (response.ok) {
                const updatedMapping = await response.json();
                const button = document.getElementById(`ingredient_${currentIngredientId}`);
                button.textContent = updatedMapping.friendlyName;
            }
        }

        window.onload = fetchRecipeDetails;
    </script>
</body>
</html>
