<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assign Mapping</title>
    <link type="text/css" rel="stylesheet" href="base-styles.css" />
</head>
<body>
    <h1>Assign Mapping</h1>
    <input type="text" id="searchQuery" placeholder="Search for goods" oninput="fetchMappingOptions()">
    <div id="goodOptions">
        <!-- good options will be displayed here -->
    </div>
    <script>
        async function fetchMappingOptions() {
            try {
                const urlParams = new URLSearchParams(window.location.search);
                const ingredientId = urlParams.get('ingredientId');
                const userId = urlParams.get('userId');
                const searchQuery = document.getElementById('searchQuery').value;
                const response = await fetch(`/Good/search?query=${searchQuery}`);

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const goods = await response.json();
                const goodOptions = document.getElementById('goodOptions');
                goodOptions.innerHTML = '';

                goods.forEach(good => {
                    const goodItem = document.createElement('button');
                    goodItem.className = 'good-item';
                    goodItem.textContent = good.friendlyName;
                    goodItem.onclick = function () {
                        assignMapping(ingredientId, good.id, userId);
                    };
                    goodOptions.appendChild(goodItem);
                });
            } catch (error) {
                console.error('Error fetching mapping options:', error);
            }
        }

        async function assignMapping(ingredientId, goodId, userId) {
            try {
                const response = await fetch(`/api/ingredientMapping`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ ingredientId, goodId, userId })
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                window.parent.closeIframe();
            } catch (error) {
                console.error('Error assigning mapping:', error);
            }
        }

        window.onload = fetchMappingOptions;
    </script>
</body>
</html>
