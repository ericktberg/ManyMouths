<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Recipe</title>
    <link type="text/css" rel="stylesheet" href="base-styles.css" />
</head>
<body>
    <h1>Add Recipe</h1>
    <form id="addRecipeForm">
        <div>
            <label for="recipeName">Recipe Name:</label>
            <input type="text" id="recipeName" name="recipeName" required>
        </div>
        <div id="ingredientsContainer">
            <h3>Ingredients</h3>
            <div class="ingredient">
                <label for="ingredientName">Name:</label>
                <input type="text" class="ingredientName" required>
                <label for="ingredientQuantity">Quantity:</label>
                <input type="number" class="ingredientQuantity" required>
                <label for="ingredientUnit">Unit:</label>
                <input type="text" class="ingredientUnit" required>
            </div>
        </div>
        <button type="button" id="addIngredientButton">Add Ingredient</button>
        <button type="submit">Add Recipe</button>
    </form>

    <script>
    // Function to get query parameters from the URL
        function getQueryParam(param) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(param);
        }

        // Get the UserId from the URL
        const userId = getQueryParam('userId');

        document.getElementById('addIngredientButton').addEventListener('click', function () {
            const ingredientDiv = document.createElement('div');
            ingredientDiv.className = 'ingredient';
            ingredientDiv.innerHTML = `
                        <label for="ingredientName">Name:</label>
                        <input type="text" class="ingredientName" required>
                        <label for="ingredientQuantity">Quantity:</label>
                        <input type="number" class="ingredientQuantity" required>
                        <label for="ingredientUnit">Unit:</label>
                        <input type="text" class="ingredientUnit" required>
                    `;
            document.getElementById('ingredientsContainer').appendChild(ingredientDiv);
        });

        document.getElementById('addRecipeForm').addEventListener('submit', async function (event) {
            event.preventDefault();

            const recipeName = document.getElementById('recipeName').value;
            const ingredients = Array.from(document.getElementsByClassName('ingredient')).map(ingredientDiv => {
                return {
                    Name: ingredientDiv.querySelector('.ingredientName').value,
                    Quantity: parseFloat(ingredientDiv.querySelector('.ingredientQuantity').value),
                    Unit: ingredientDiv.querySelector('.ingredientUnit').value
                };
            });

            const recipe = {
                Name: recipeName,
                Ingredients: ingredients,
                UserId: userId
            };

            const response = await fetch('/api/recipes', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(recipe)
            });

            if (response.ok) {
                window.location.href = `userrecipes.html?userId=${userId}`;
            } else {
                alert('Failed to add recipe');
            }
        });</script>
</body>
</html>
